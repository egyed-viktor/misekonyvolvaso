<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1F1A">
<title>Római Misekönyv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --leather:#4A1F1A; --leather-2:#341511;
  --paper:#F7F0E1; --paper-2:#EFE5D0; --paper-edge:#E2D3B4;
  --ink:#241A12; --muted:#76695A; --line:#D9CBAE;
  --rubric:#A4211B; --gold:#B48A3C;
  --lit-green:#2C6B42; --lit-violet:#5A3A82; --lit-white:#B48A3C; --lit-red:#B0231F; --lit-rose:#C0668A;
  --lit:var(--lit-green);
  --fs:19px;
  --serif:"EB Garamond", Garamond, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --pdf-filter:none;
  --ord-blend:multiply;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --leather:#1E0F0C; --leather-2:#140907;
    --paper:#1C1813; --paper-2:#25201A; --paper-edge:#3A3127;
    --ink:#E8DEC9; --muted:#A99C87; --line:#3B3328;
    --rubric:#E27A6B; --gold:#D6B266;
    --lit-green:#62AE7C; --lit-violet:#A98BD2; --lit-white:#D6B266; --lit-red:#E3635F; --lit-rose:#E496B4;
    --pdf-filter:invert(.88) hue-rotate(180deg) sepia(.15); --ord-blend:normal;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --leather:#1E0F0C; --leather-2:#140907;
  --paper:#1C1813; --paper-2:#25201A; --paper-edge:#3A3127;
  --ink:#E8DEC9; --muted:#A99C87; --line:#3B3328;
  --rubric:#E27A6B; --gold:#D6B266;
  --lit-green:#62AE7C; --lit-violet:#A98BD2; --lit-white:#D6B266; --lit-red:#E3635F; --lit-rose:#E496B4;
  --pdf-filter:invert(.88) hue-rotate(180deg) sepia(.15); --ord-blend:normal;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sechead > div{display:flex;gap:2px}
.sc{font-variant-caps:all-small-caps;letter-spacing:.06em}
.rub{color:var(--rubric)}

/* ---------- Book layout ---------- */
.book{position:relative}
.page{background:var(--paper);position:relative}
.page.left{padding-bottom:96px}
.page.right{padding-bottom:96px}
.left > section{display:none}
.left > section.active{display:block}
body[data-view="today"] .page.left{display:none}
body:not([data-view="today"]) .page.right{display:none}
.ltabs{display:none}

@media (min-width:760px){
  html,body{background:var(--leather)}
  body{background:radial-gradient(120% 90% at 50% 0%, var(--leather) 0%, var(--leather-2) 100%) fixed}
  .book{max-width:820px;margin:20px auto 0;padding:0 20px}
  .page{border-radius:6px 6px 0 0;box-shadow:0 0 0 1px var(--paper-edge), 0 24px 50px -20px rgba(0,0,0,.6);
        background:linear-gradient(90deg,var(--paper-2) 0,var(--paper) 22px) }
}
@media (min-width:1200px){
  body{height:100%;overflow:hidden}
  html{height:100%}
  .book{max-width:1500px;height:calc(100% - 40px);margin:20px auto;padding:0 28px;display:grid;grid-template-columns:minmax(380px,.82fr) 1.18fr;gap:0}
  body[data-view] .page.left, body[data-view] .page.right{display:block}
  .page{height:100%;overflow-y:auto;border-radius:0;padding-bottom:40px}
  .page.left{border-radius:8px 0 0 8px;background:linear-gradient(270deg,var(--paper-2) 0,var(--paper) 40px)}
  .page.right{border-radius:0 8px 8px 0;background:linear-gradient(90deg,var(--paper-2) 0,var(--paper) 40px)}
  .page.left::after{content:"";position:sticky;display:block}
  .tabs{display:none!important}
  .ltabs{display:flex;gap:0;padding:22px 36px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:3}
  .ltabs button{border:0;background:transparent;padding:10px 16px 12px;cursor:pointer;font-size:18px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .ltabs button[aria-selected="true"]{color:var(--rubric);border-color:var(--rubric)}
  .left > section{display:none!important}
  .left > section.lactive{display:block!important}
}

.inner{max-width:680px;margin:0 auto;padding:0 22px}
@media (min-width:760px){.inner{padding:0 44px}}

/* ---------- Ribbons ---------- */
.ribbons{position:absolute;top:0;right:18px;display:flex;gap:5px;z-index:2;pointer-events:none}
.ribbons i{display:block;width:13px;height:38px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);opacity:.85;transition:height .45s ease}
.ribbons i.on{height:96px;opacity:1;width:16px}
@media (min-width:760px){.ribbons{right:44px;top:-6px}}

/* ---------- Mass header ---------- */
.head{padding:18px 0 6px;text-align:center}
.datenav{display:flex;align-items:center;justify-content:center;gap:6px;margin-right:84px;margin-left:0}
@media (min-width:760px){.datenav{margin-right:0}}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--paper-2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.datelabel{font-size:17px;color:var(--muted);min-width:0}
.cross{color:var(--rubric);font-size:22px;line-height:1;margin:16px 0 6px}
.daytitle{font-weight:600;font-size:clamp(28px,5.2vw,40px);line-height:1.1;margin:0 0 8px;color:var(--rubric);font-variant-caps:small-caps;letter-spacing:.01em}
.meta{font-style:italic;color:var(--muted);font-size:17px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px}
.celebration{margin:10px auto 0;font-size:20px;max-width:34ch}
.online{margin:10px auto 0;font-size:14px;color:var(--muted);max-width:52ch}
.online b{color:var(--ink);font-weight:600}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:16px 0 4px}
.choice{border:1px solid var(--line);background:transparent;border-radius:3px;padding:6px 12px 6px 10px;font-size:16px;line-height:1.25;display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-align:left;max-width:100%}
.choice:hover:not(:disabled){border-color:var(--muted)}
.choice:disabled{cursor:default}
.choice[aria-checked="true"]{border-color:var(--rubric);box-shadow:inset 0 0 0 1px var(--rubric);background:var(--paper-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.dot.empty{border:1.5px solid currentColor;background:transparent!important}
.choice small{color:var(--muted);font-style:italic;font-size:14px}
.headactions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.lnk{border:0;background:transparent;color:var(--rubric);cursor:pointer;font-size:16px;padding:4px 8px;display:inline-flex;align-items:center;gap:6px;border-radius:3px}
.lnk:hover{background:var(--paper-2)}
.lnk svg{width:16px;height:16px}
.lnk[aria-pressed="true"] svg{fill:currentColor}

.orn{display:flex;align-items:center;gap:14px;color:var(--rubric);margin:22px 0 14px;font-size:15px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Order of the day ---------- */
.rend{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:16px}
@media (min-width:520px){.rend{grid-template-columns:repeat(3,1fr)}}
.rend div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}
.rend span:last-child{font-style:italic}
.rend .no{color:var(--muted)}

/* ---------- Sections (no PDF) ---------- */
.sect h3{font-variant-caps:small-caps;letter-spacing:.03em;color:var(--rubric);font-weight:600;font-size:21px;margin:26px 0 4px;text-align:center}
.part{margin:0 0 16px}
.part > button{width:100%;display:flex;align-items:baseline;gap:10px;border:0;background:transparent;cursor:pointer;text-align:left;padding:6px 0}
.part .t{font-weight:600;font-size:19px;color:var(--rubric)}
.part .m{font-style:italic;color:var(--muted);font-size:15px;flex:1}
.part .chev{width:15px;height:15px;color:var(--muted);transition:transform .2s;align-self:center}
.part.open .chev{transform:rotate(90deg)}
.part .body{display:none;font-size:var(--fs);line-height:1.62}
.part.open .body{display:block}
.part .body p{margin:0 0 .4em}
.part .body .bar{display:block;height:.62em;border-radius:2px;background:var(--paper-2);margin:.5em 0}
.part .body .first::first-letter{color:var(--rubric)}

/* ---------- PDF ---------- */
.pdfcard{border:1px solid var(--line);border-radius:4px;padding:18px 18px 16px;background:var(--paper-2);margin:8px 0}
.pdfcard h3{margin:0 0 6px;font-size:20px;font-weight:600}
.pdfcard p{margin:0 0 12px;line-height:1.5}
.btn{border:1px solid var(--rubric);background:var(--rubric);color:#FFF8EC;border-radius:3px;padding:8px 16px;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--rubric)}
.btn:hover{filter:brightness(1.08)}
.progress{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.pdfbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0 10px;font-size:16px}
.pdfbar .where{flex:1;min-width:160px;font-style:italic;color:var(--muted)}
.hits{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.hit{border:1px solid var(--line);background:transparent;border-radius:3px;padding:3px 10px;font-size:15px;cursor:pointer}
.hit[aria-pressed="true"]{border-color:var(--rubric);color:var(--rubric)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--rubric);color:#FFF8EC}
.pdfpages canvas{display:block;width:100%;height:auto;margin:0 auto 14px;box-shadow:0 0 0 1px var(--line);filter:var(--pdf-filter);background:#fff}
.pdfscroll{overflow-x:auto}
.pdftext{font-size:var(--fs);line-height:1.62;white-space:pre-wrap}
.pdftext .pg{display:block;text-align:center;color:var(--rubric);font-style:italic;font-size:15px;margin:18px 0 8px}
.searchrow{display:flex;gap:8px;margin:8px 0 12px}
.searchrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:8px 10px}


/* ---------- Misekönyv szövege ---------- */
.btext .bh{text-align:center;color:var(--rubric);font-variant-caps:small-caps;letter-spacing:.02em;font-size:calc(var(--fs)*1.15);font-weight:600;margin:14px 0 4px}
.btext .bw{text-align:center;font-style:italic;color:var(--rubric);margin:2px 0 6px;font-size:calc(var(--fs)*.9)}
.btext .tx{font-size:var(--fs);line-height:1.5;margin:0 0 .75em}
.btext .rb{color:var(--rubric);font-size:calc(var(--fs)*.84);line-height:1.45;margin:0 0 .75em}
.btext .ref{display:block;color:var(--rubric);font-style:italic;font-size:calc(var(--fs)*.72);line-height:1.3;margin:0 0 2px}
.btext .ini{color:var(--rubric);font-size:2.05em;line-height:.85;float:left;margin:.06em .07em 0 0}
.btext .tx::after{content:"";display:block;clear:both}
.pref{border:0;background:none;color:var(--rubric);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font:inherit}
#booktext .part{margin:0 0 10px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:16px;user-select:none;padding:4px 10px;border:1px solid var(--line);border-radius:3px;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .knob{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked + .knob{background:var(--rubric)}
.sw input:checked + .knob::after{transform:translateX(14px)}
.sw input:focus-visible + .knob{outline:2px solid var(--gold);outline-offset:2px}
.ord canvas{display:block;width:100%;height:auto;filter:var(--pdf-filter);mix-blend-mode:var(--ord-blend)}
.ordpart > button .t{color:var(--muted)}
.chantbox{margin:4px 0 12px;overflow-x:auto}
svg.chant{display:block;max-width:100%;height:auto;fill:var(--ink);margin:0 0 2px}
svg.chant .sl{stroke:var(--muted);stroke-width:1}
svg.chant .bl{stroke:var(--ink);stroke-width:1.3}
svg.chant .hol{fill:none;stroke:var(--ink);stroke-width:1.3}
svg.chant text{fill:var(--ink)}
svg.chant text.vr,.vr{fill:var(--rubric);color:var(--rubric)}
.chanttx{font-weight:400}
.btext i.mel{font-style:italic}
.btext .spk{color:var(--rubric);font-size:.86em}
.btext .sym,.btext .flx{color:var(--rubric)}
.btext .tx{font-feature-settings:normal}
.ordtail{margin:-4px 0 12px}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:10px 0 2px}
@media (max-width:759px){.modes{margin-right:64px}}
.mode{border:0;background:transparent;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:16px;color:var(--muted);border-bottom:2px solid transparent}
.mode[aria-selected="true"]{color:var(--rubric);border-bottom-color:var(--rubric)}
.mode:hover{color:var(--ink)}
.forms{margin:4px 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:4px}
.forms .hits{margin:6px 0 0}
.note{font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper-2);border-left:3px solid var(--gold);padding:8px 12px;margin:10px 0}
.note.warn{border-left-color:var(--rubric)}
.btext .tx.ins{border-left:2px solid var(--gold);padding-left:10px}
.addn{font-size:calc(var(--fs)*.8);line-height:1.45;color:var(--muted);font-style:italic;border-left:2px dotted var(--gold);padding:2px 0 2px 10px;margin:4px 0 12px}
.addn .tag,.note .tag{display:inline-block;font-style:normal;font-variant-caps:all-small-caps;letter-spacing:.05em;color:var(--gold);margin-right:8px;font-size:.95em}
.ui{font-size:15px;color:var(--muted);margin:0 0 4px}
.disclaimer{font-size:13px;line-height:1.5;color:var(--muted);font-style:italic;text-align:center;border-top:1px solid var(--line);margin:18px 0 28px;padding:14px 8px 0;opacity:.85}
.blesssel{margin:8px 0 12px}
.blesssel select{max-width:100%;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.selwrap{display:inline-block;max-width:100%}
.selwrap select{max-width:100%;font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btext .flx{color:var(--rubric)}
.optr{color:var(--rubric);font-style:italic;opacity:.92}
.alts{border-left:2px solid var(--line);padding-left:12px;margin:6px 0 12px}
.alts > .hits{margin:4px 0 8px}
.chantbox.gen svg.chant{opacity:.98}
.part .t small.from{font-weight:400;font-style:italic;color:var(--muted);font-size:14px;font-variant-caps:normal}
.comm{margin:6px 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:4px}
.comm .rb{margin:0 0 8px}
.hit.off{opacity:.62}
.preftext{margin-top:6px}
.btext .hits{margin:6px 0 10px}
#booktext .part .body{display:none}
#booktext .part.open .body{display:block}

/* ---------- Votive ---------- */
.vcond{border-left:3px solid var(--gold);padding:4px 0 4px 16px;margin:8px 0 16px;line-height:1.55}
.vcond.lvl-grave{border-color:var(--rubric)}
.vcond h3{margin:0 0 6px;font-size:20px;font-weight:600}
.vcond p{margin:0 0 8px}
.vcond ul{margin:4px 0 10px;padding-left:20px}
.vcond li{margin:0 0 4px}
.vcond .src{font-size:14px;color:var(--muted);font-style:italic}
.vlist{border-top:1px solid var(--line);margin:0 0 10px}
.vrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;font-size:18px}
.vrow[aria-checked="true"]{color:var(--rubric);font-weight:600}
.vrow .ck{margin-left:auto;visibility:hidden}
.vrow[aria-checked="true"] .ck{visibility:visible}
@media (min-width:760px){.vlist{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}}

/* ---------- Calendar ---------- */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 0 6px}
.sechead h2{margin:0;font-size:28px;font-weight:600;font-variant-caps:small-caps;color:var(--rubric)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:14px;color:var(--muted);text-align:center;padding:6px 0;font-style:italic}
.cell{aspect-ratio:1/1.05;border:0;background:transparent;border-radius:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:18px}
.cell:hover{background:var(--paper-2)}
.cell.other{opacity:.35}
.cell .bar{width:18px;height:3px;border-radius:2px}
.cell.sol .num{font-weight:700;color:var(--rubric)}
.cell.sol .bar{width:7px;height:7px;border-radius:50%}
.cell.today .num{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--rubric)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 0 0;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.jump{display:flex;gap:8px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.jump input{border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:6px 8px}
.h3{font-size:22px;font-weight:600;margin:28px 0 8px;font-variant-caps:small-caps;color:var(--rubric)}
.favlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.favlist li{border-bottom:1px solid var(--line)}
.favlist button{width:100%;text-align:left;border:0;background:transparent;padding:10px 2px;cursor:pointer;display:flex;gap:12px;align-items:center}
.favlist .ft{display:block;font-size:18px}
.favlist .fd{font-size:14px;color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-style:italic;line-height:1.5}
.small{font-size:15px;color:var(--muted);line-height:1.5}

/* ---------- Ordo ---------- */
.ordo{list-style:none;margin:0;padding:0;counter-reset:o}
.ordo .ph{display:block;padding:0;border:0}
.ordo .ph h3{font-variant-caps:small-caps;color:var(--rubric);font-weight:600;font-size:21px;margin:24px 0 6px}
.ordo li.st{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ordo li.st::before{counter-increment:o;content:counter(o) ".";color:var(--rubric);font-size:16px;padding-top:2px}
.ordo .ot{font-size:19px;font-weight:500}
.ordo .od{grid-column:2;font-size:16px;color:var(--muted);line-height:1.45}
.ordo .who{grid-column:2;font-size:15px;color:var(--rubric);font-style:italic}

/* ---------- Settings ---------- */
.set{padding:16px 0;border-bottom:1px solid var(--line)}
.set .lbl{display:block;font-size:19px;font-weight:600;margin-bottom:8px}
.set input[type=range]{width:100%;accent-color:var(--rubric)}
.set input[type=url]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:7px 9px;font-size:15px}
.set label.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;line-height:1.4}
.preview{font-size:var(--fs);line-height:1.6;margin:10px 0 0}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;margin:0}
dl.info dt{color:var(--muted);font-style:italic}
dl.info dd{margin:0}

/* ---------- Tab bar (mobile & tablet) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--leather);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:#D9C9A8;cursor:pointer;padding:5px 0}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:#FFF3D6}
.tab[aria-selected="true"] span{border-bottom:1.5px solid var(--gold)}
@media (min-width:760px){.tabs{max-width:820px;margin:0 auto;padding-left:26px;padding-right:26px;background:var(--leather-2)}}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:3px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const isUpWord=w=>/\p{L}/u.test(w)&&w===w.toUpperCase()&&w!==w.toLowerCase();

  const tryL=(lab)=>{const f=fold(lab).replace(/[:.]+$/,'').trim();return G_LABEL_LIST.find(([w])=>w===f)};
  for(let m=k;m>=1;m--){const lab=ws.slice(0,m).join(' ');const hit=tryL(lab);if(hit)return {k:hit[1],rest:ws.slice(m).join(' '),used:0}}
  if(k>=1&&nextText){const nw=nextText.split(/\s+/);let j=0;while(j<nw.length&&isUpWord(nw[j].replace(/[:.]$/,'')))j++;
    for(let m=j;m>=1;m--){const lab=ws.slice(0,k).join(' ')+' '+nw.slice(0,m).join(' ');const hit=tryL(lab);if(hit)return {k:hit[1],rest:ws.slice(k).join(' '),used:m}}}

function genericPageEvents(items,n,meta){
  const body=meta.body||11,H=meta.h||842,Wd=meta.w||595;
  const fx=meta.fixHu?fixHu:(t=>t);
  items=items.filter(t=>t.str.trim()!=='');
  items=items.filter(t=>!(t.y>H*0.9&&t.s<=body*1.05&&/\d/.test(t.str))&&!(t.y<H*0.06&&/^\s*\d+\s*$/.test(t.str)));
  const drops=items.filter(t=>t.str.trim().length===1&&t.s>=body*2);items=items.filter(t=>!drops.includes(t));
  const lines=[];items.slice().sort((a,b)=>b.y-a.y||a.x-b.x).forEach(t=>{const l=lines.find(l=>Math.abs(l.y-t.y)<Math.max(1.6,t.s*0.2));if(l)l.items.push(t);else lines.push({y:t.y,items:[t]})});

async function onlineCheck(d,force){
  const k=iso(d);
  if(onlineCache[k]&&!force) return onlineCache[k];
  const url=onlineUrl.replace('{y}',d.getFullYear()).replace('{m}',d.getMonth()+1).replace('{d}',d.getDate());
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const c=(j.celebrations&&j.celebrations[0])||{};
    const res={ok:true,title:c.title||'',colour:c.colour||c.color||'',rank:c.rank||'',season:j.season||''};
    onlineCache[k]=res;
    const keys=Object.keys(onlineCache);if(keys.length>400)delete onlineCache[keys[0]];
    store.set('onlineCache',onlineCache);
    return res;
  }catch(e){clearTimeout(to);return {ok:false,error:e.name==='AbortError'?'időtúllépés':e.message}}
}
async function showOnline(force){

}

const STD=['BEVEZETŐ ÉNEK','KÖNYÖRGÉS','FELAJÁNLÓ KÖNYÖRGÉS','PREFÁCIÓ','ÁLDOZÁSI ÉNEK','ÁLDOZÁS UTÁNI KÖNYÖRGÉS'];

const CN=IDX.C.map((c,i)=>({i,lvl:c[0],path:c[1],leaf:!!c[2],seg:c.slice(3,7)}));

function resolveCommon(text){
  const parts=text.split(/,?\s+vagy\s+/i);let cat=null;const found=[];
  for(const part of parts){
    const m=part.match(/(\d{3,4})\. o\./);if(!m)continue;const P=+m[1];if(P<771||P>844)continue;
    const t=low(part.replace(/,?\s*\d{3,4}\. o\..*$/,'')).trim();
    const top=TOPS.find(n=>t.includes(low(n.path[0])))||(cat&&!t.includes('misé')?cat:null)||[...TOPS].reverse().find(n=>n.seg[0]<=P);
    if(!top)continue;cat=top;

    sub=sub.replace(/^[\s,]+|[\s,.]+$/g,'');

    if(sub){
      const desc=CN.filter(n=>n.i>top.i&&n.i<nextTopIdx(top));
      const lab=n=>low(n.path[n.path.length-1]);

  if(/Adventi időben/.test(p))return season==='advent'?1:-1;
  if(/Karácsonyi időben/.test(p))return season==='christmas'?1:-1;
  if(/Évközi időben/.test(p))return ['advent','christmas','easter'].includes(season)?-1:1;

}

  const opts=leaves.map((l,k)=>({k,l,score:seasonScore(l.path,L.season)})).sort((a,b)=>b.score-a.score||a.k-b.k)
    .map(o=>({label:(tops.size>1?o.l.path:o.l.path.slice(1)).join(' › ')||o.l.path[0],seg:o.l.seg,off:o.score<0}));

async function composeMass(r,L,ch){

  const missing=STD.filter(x=>x!=='PREFÁCIÓ'&&!have.has(x));
  const cc=choices[iso(sel)]||{};
  let common=null;
  if(r.common&&missing.length&&!PDF.generic){
    const rub=r.forceText||rubricOf(own.intro);
    let opts=[];
    const refs=[...rub.matchAll(/(\d{3,4})\. o\./g)].map(m=>+m[1]);
    if(refs.some(p=>p>=771&&p<=844))opts=commonOptions(rub,L);
    else{const mp=refs.find(p=>(p>=107&&p<=410)||(p>=563&&p<=768)||(p>=995&&p<=1014));
      if(mp){const s=ALLSEG.filter(x=>x.seg[0]===mp);if(s.length){opts=s.map(x=>({label:x.label||`a ${mp}. oldalon kezdődő mise`,seg:x.seg}));opts.mass=true}}}
    if(!opts.length)opts=commonOptions(guessCommonText(r.guess),L);
    if(opts.length){
      const idx=Number.isInteger(cc.com)&&cc.com<opts.length?cc.com:0;
      common={opts,idx,evs:await segEvents(opts[idx].seg),mass:!!opts.mass};
    }

    }

      if(it.k==='W')return isVagy(it)?'':`<p class="bw">${esc(it.t)}</p>`;
      if(it.k==='R')return `<span class="ref">${esc(it.t)}</span>`;
      if(it.k==='r'){if(it.insNote||it.forceRub)return `<p class="rb">${linkRefs(esc(it.text||it.lines.map(l=>l.t).join(' ')))}</p>`;if(isVagy(it))return '';return rubricHtml(it.text)}
      // szövegtörzs
      const lineHtml=l=>{
        // a misekönyv jelölései: dőlt (dallamjelölő) szótagok, pirossal szedett szereplők (pl. „(Mind)”, „(1. K.)”), †
        const t=l.t,n=t.length,fl=new Array(n).fill(0);
        (l.ital||[]).forEach(([a,b])=>{for(let i=Math.max(0,a);i<Math.min(n,b);i++)fl[i]|=1});
        (l.rr||[]).forEach(([a,b])=>{for(let i=Math.max(0,a);i<Math.min(n,b);i++)fl[i]|=2});
        let h='',i=0;
        if(l.drop&&n>1){h+=`<span class="ini">${esc(t[0])}</span>`;i=1}
        while(i<n){let j=i;while(j<n&&fl[j]===fl[i])j++;let seg=redSyms(esc(t.slice(i,j)),i===(l.drop&&n>1?1:0));
          if(fl[i]&1)seg=`<i class="mel">${seg}</i>`;if(fl[i]&2)seg=`<span class="spk">${seg}</span>`;h+=seg;i=j}
        return h};
      return `<p class="tx${it.ins?' ins':''}">${it.refs.map(r=>`<span class="ref">${esc(r)}</span>`).join('')}${it.lines.map(lineHtml).join('<br>')}</p>`;
    }).join('');
  };
  return render(items);
}

}

const wide=window.matchMedia('(min-width:1200px)');
function setDate(d){sel=d;renderHead();renderToday();if(isVisible('cal'))renderCal();if(isVisible('set'))renderSet()}
function isVisible(v){return wide.matches?leftView===v:view===v}
function showMass(){if(!wide.matches)switchView('today')}
function switchView(v){
  if(wide.matches&&v==='today')return;
  view=v;document.body.dataset.view=v;
  if(v!=='today')setLeft(v);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='today')renderPdfPages();
}
function setLeft(v){
  leftView=v;
  document.querySelectorAll('.left > section').forEach(s=>{const on=s.id==='v-'+v;s.classList.toggle('active',on);s.classList.toggle('lactive',on)});
  document.querySelectorAll('.ltabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===v));
  if(v==='cal'){calMonth=D(sel.getFullYear(),sel.getMonth(),1);renderCal()}
  if(v==='ordo')renderOrdo();
  if(v==='set')renderSet();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.v));
document.querySelectorAll('.ltabs button').forEach(b=>b.onclick=()=>setLeft(b.dataset.l));
wide.addEventListener('change',()=>{if(wide.matches){document.body.dataset.view='today';setLeft(leftView)}else{document.body.dataset.view=view}renderPdfPages()});
$('prev').onclick=()=>setDate(add(sel,-1));
$('next').onclick=()=>setDate(add(sel,1));
$('gotoday').onclick=()=>setDate(TODAY);
$('fav').onclick=()=>{const k=iso(sel);favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];store.set('favs',favs);renderHead();if(isVisible('cal'))renderCal()};
let sx=null,sy=null;
$('right').addEventListener('touchstart',e=>{if(e.touches.length!==1||book.zoom>1){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('right').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.6)setDate(add(sel,dx<0?1:-1));sx=null},{passive:true});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowLeft')setDate(add(sel,-1));if(e.key==='ArrowRight')setDate(add(sel,1))});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderPdfPages,250)});

applyTheme();applyFont();renderHead();renderToday();setLeft('cal');
initPdf();
})();
</script>

<script id="mk-export">
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FONTS='https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=block';
const DEF={fs:12.5,size:'A4',lh:'normal',color:'red',rh:true,folio:'center',margin:'normal',titlePage:false};
const loadOpts=()=>{try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('misekonyv:exportOpts')||'{}'))}catch(e){return Object.assign({},DEF)}};
const saveOpts=o=>{try{localStorage.setItem('misekonyv:exportOpts',JSON.stringify(o))}catch(e){}};
/* ---- 1. A megjelenített mise kiolvasása (csak a szertartás szövege) ---- */
function extract(){
  const bt=$('booktext');
  if(!bt||!bt.classList.contains('btext')||!bt.querySelector('.part,.tx'))return null;
  const head={
    date:($('datelabel')||{}).textContent||'',
    title:($('daytitle')||{}).textContent||'',
    cel:$('celebration')&&!$('celebration').hidden?$('celebration').textContent.trim():'',
    meta:$('meta')?[...$('meta').children].map(x=>x.textContent.trim()).filter(Boolean).join(' · '):''
  };
  const clone=bt.cloneNode(true);
  clone.querySelectorAll('.hits,.forms,.comm,.blesssel,select,.note,svg,.ui').forEach(e=>e.remove());
  clone.querySelectorAll('button.pref').forEach(b=>b.replaceWith(document.createTextNode(b.textContent)));
  const out=[];
  const pushBody=(el)=>{[...el.children].forEach(c=>{
    if(c.matches('.btext,.alts,.preftext,.body'))pushBody(c);
    else if(c.matches('p,h4,span.ref'))out.push({t:'blk',html:c.outerHTML,cls:c.className});
  })};
  [...clone.children].forEach(ch=>{
    if(ch.matches('.part')){
      const tEl=ch.querySelector(':scope > button .t');let title='';
      if(tEl){const t2=tEl.cloneNode(true);t2.querySelectorAll('small').forEach(x=>x.remove());title=t2.textContent.trim()}
      const ord=ch.classList.contains('ordpart'),closed=!ch.classList.contains('open');
      const body=ch.querySelector(':scope > .body');
      out.push({t:'hd',text:title,ord,closed});
      if(body&&!closed)pushBody(body);
    } else if(ch.matches('p,h4'))out.push({t:'blk',html:ch.outerHTML,cls:ch.className});
    else pushBody(ch);
  });
  return {head,items:out};
}
function docBody(d){
  const h=d.head;
  let s=`<div class="doc-head" data-keep="1"><div class="date">${esc(h.date)}</div><div class="cross">✠</div><h1>${esc(h.title)}</h1>${h.meta?`<div class="meta">${esc(h.meta)}</div>`:''}${h.cel?`<div class="cel">${esc(h.cel)}</div>`:''}</div>`;
  const norm=t=>(t||'').toLowerCase().replace(/[^a-záéíóöőúüű]/g,'');
  d.items.forEach((it,i)=>{
    if(it.t==='hd'){
      const nx=d.items[i+1];const dup=it.ord&&nx&&nx.t==='blk'&&/\bbh\b/.test(nx.cls||'')&&norm(nx.html.replace(/<[^>]+>/g,''))===norm(it.text);
      if(it.text&&!dup)s+=`<div class="hd${it.ord?' ord':''}"${it.closed?'':' data-keep="1"'}>${esc(it.text)}</div>`;
    } else {
      const txt=it.html.replace(/<[^>]+>/g,'').trim();
      const keep=/\b(rb|bh|bw)\b/.test(it.cls||'')&&(/:\s*$/.test(txt)||/\b(bh|bw)\b/.test(it.cls||''));
      s+=keep?it.html.replace(/^<(\w+)/,'<$1 data-keep="1"'):it.html;
    }
  });
  return s;
}
/* ---- 2. Közös misekönyv-stílus (a beállítások szerint) ---- */
const SIZES={A4:{w:210,h:297},A5:{w:148,h:210},B5:{w:176,h:250},Letter:{w:216,h:279}};

  if(o.margin==='bind')return {t:base.t,b:base.b,i:base.i+9,x:base.x};
  if(o.margin==='narrow')return {t:base.t-4,b:base.b-3,i:base.i-5,x:base.x-5};
  return base}
function styleFor(o){
  const f=+o.fs||12.5,rub=o.color==='bw'?'#1a1a1a':'#a4211b',soft=o.color==='bw'?'#555':'#6d6156',lh=o.lh==='airy'?1.66:o.lh==='tight'?1.3:1.44;
  return `
*{box-sizing:border-box}
body{margin:0;font-family:"EB Garamond",Garamond,"Palatino Linotype",Georgia,serif;color:#1d1712;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc-head{text-align:center;margin:0 0 14pt}

.doc-head .cross{color:${rub};font-size:15pt;margin:8pt 0 2pt}
.doc-head h1{font-size:${Math.max(18,f*1.5)}pt;font-weight:600;color:${rub};font-variant-caps:small-caps;letter-spacing:.01em;margin:0 0 3pt;line-height:1.15}
.doc-head .meta{font-size:10.5pt;font-style:italic;color:${soft}}
.doc-head .cel{font-size:${Math.max(12,f)}pt;margin-top:4pt}
.hd{color:${rub};font-variant-caps:small-caps;font-weight:600;font-size:${Math.max(12,f)}pt;margin:12pt 0 3pt;letter-spacing:.02em}
.hd.ord{text-align:center;margin-top:14pt}
.hd.ord::before{content:"— ";color:#c9b9a0}.hd.ord::after{content:" —";color:#c9b9a0}
p{margin:0 0 ${(f*0.5).toFixed(1)}pt}
.tx{font-size:${f}pt;line-height:${lh};orphans:2;widows:2}
.rb{font-size:${Math.max(9.5,Math.round(f*0.82*10)/10)}pt;line-height:1.35;color:${rub}${o.color==='bw'?';font-style:italic':''}}
.optr{font-style:italic}
.bh{text-align:center;color:${rub};font-variant-caps:small-caps;font-size:${f}pt;font-weight:600;margin:9pt 0 3pt}
.bw{text-align:center;font-style:italic;color:${rub};font-size:${Math.max(10.5,f*0.88)}pt;margin:2pt 0 4pt}
.ref{display:block;color:${rub};font-style:italic;font-size:${Math.max(9,f*0.74)}pt}
.ini{color:${rub};font-size:2.1em;line-height:.85;float:left;margin:.06em .07em 0 0}
.tx::after{content:"";display:block;clear:both}
.tx.cont .ini{float:none;font-size:1em;color:inherit}
.sym,.flx,.spk{color:${rub}}.spk{font-size:.86em}
i.mel{font-style:italic}
.ins{border-left:1.5pt solid #c8a45a;padding-left:6pt}
.addn{font-size:${Math.max(9,f*0.74)}pt;font-style:italic;color:#7a6d60;border-left:1pt dotted #c8a45a;padding-left:6pt}
.addn .tag{font-style:normal;font-variant-caps:all-small-caps;color:#a88a4e;margin-right:5pt}
.chanttx{font-weight:400}`;
}
/* ---- 3. Nyomtatási előnézet: a beállítások ott is módosíthatók, a tördelés azonnal frissül ---- */
function previewMain(DATA){
  const SIZES=DATA.SIZES;let O=DATA.opts;
  const st=document.getElementById('mkstyle'),flow=document.getElementById('flow'),book=document.getElementById('book');
  const marginsFor=new Function('return '+DATA.marginsSrc)(),styleFor=new Function('return '+DATA.styleSrc)();
  const ctl=document.getElementById('ctl');
  const set=(k,v)=>{O[k]=v;try{localStorage.setItem('misekonyv:exportOpts',JSON.stringify(O))}catch(e){};layout()};
  // vezérlők
  ctl.innerHTML=`<label>Betűméret <input id="c-fs" type="range" min="9" max="40" step="0.5" value="${O.fs}"><input id="c-fsn" type="number" min="9" max="40" step="0.5" value="${O.fs}"> pt</label>

const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function docxBlocks(d,o){
  const f=+o.fs||12.5,RED=o.color==='bw'?'1A1A1A':'A4211B',SOFT=o.color==='bw'?'555555':'6D6156';
  const lh=o.lh==='airy'?1.66:o.lh==='tight'?1.3:1.44;
  const root=new DOMParser().parseFromString('<div id="r">'+docBody(d)+'</div>','text/html').getElementById('r');
  const P=[];
  const para=(runs,pp)=>{pp=pp||{};const ppr=`<w:pPr>${pp.keep?'<w:keepNext/>':''}${pp.keepLines?'<w:keepLines/>':''}<w:widowControl/><w:spacing w:before="${Math.round((pp.before||0)*20)}" w:after="${Math.round((pp.after==null?f*0.5:pp.after)*20)}" w:line="${Math.round(240*(pp.lh||1.15))}" w:lineRule="auto"/>${pp.ind?`<w:ind w:left="${pp.ind}"/>`:''}${pp.jc?`<w:jc w:val="${pp.jc}"/>`:''}</w:pPr>`;P.push(`<w:p>${ppr}${runs.join('')}</w:p>`)};
  const run=(text,st)=>{if(!text)return '';const rp=`<w:rPr><w:rFonts w:ascii="EB Garamond" w:hAnsi="EB Garamond" w:cs="EB Garamond"/>${st.b?'<w:b/>':''}${st.i?'<w:i/>':''}${st.sc?'<w:smallCaps/>':''}${st.color?`<w:color w:val="${st.color}"/>`:''}<w:sz w:val="${Math.round(st.sz*2)}"/></w:rPr>`;
    return text.split('\n').map((t,k)=>(k?`<w:r>${rp}<w:br/></w:r>`:'')+(t?`<w:r>${rp}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`:'')).join('')};

  const runsOf=(el,base)=>{const out=[];const walk=(n,st)=>{
    if(n.nodeType===3){out.push(run(n.textContent.replace(/\s+/g,' '),st));return}
    if(n.nodeType!==1)return;
    if(n.tagName==='BR'){out.push(run('\n',st));return}

    if(q('.date'))para([run(q('.date').textContent,{i:true,color:SOFT,sz:10.5})],{jc:'center',after:4});
    para([run('✠',{color:RED,sz:15})],{jc:'center',after:2});
    if(q('h1'))para([run(q('h1').textContent,{b:true,sc:true,color:RED,sz:Math.max(18,f*1.5)})],{jc:'center',after:3});
    if(q('.meta'))para([run(q('.meta').textContent,{i:true,color:SOFT,sz:10.5})],{jc:'center',after:4});
    if(q('.cel'))para([run(q('.cel').textContent,{sz:Math.max(12,f)})],{jc:'center',after:12});

    if(eds[bi]!=null)el.innerHTML=eds[bi];
    if(brs.has(bi))P.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
    const c=el.classList,keep=!!el.dataset.keep;
    if(c.contains('hd'))para([run(el.textContent,{b:true,sc:true,color:RED,sz:Math.max(12,f)})],{keep:true,before:c.contains('ord')?14:11,after:3,jc:c.contains('ord')?'center':null});
    else if(c.contains('bh'))para(runsOf(el,{b:true,sc:true,color:RED,sz:f}),{keep:true,jc:'center',before:8,after:3});
    else if(c.contains('bw'))para(runsOf(el,{i:true,color:RED,sz:Math.max(10.5,f*0.88)}),{keep:true,jc:'center',after:4});
    else if(c.contains('rb'))para(runsOf(el,{color:RED,i:o.color==='bw',sz:Math.max(9.5,f*0.82)}),{keep,after:f*0.45,lh:1.2});
    else if(c.contains('addn'))para(runsOf(el,{i:true,color:'7A6D60',sz:Math.max(9,f*0.74)}),{after:f*0.45,ind:200});
    else if(c.contains('ref'))para(runsOf(el,{i:true,color:RED,sz:Math.max(9,f*0.74)}),{keep:true,after:1});

}

function dialog(){
  const d=extract();const o=loadOpts();
  const back=document.createElement('div');back.className='mkx-back';
  back.innerHTML=`<div class="mkx-dlg" role="dialog" aria-modal="true" aria-labelledby="mkx-t">
    <button class="mkx-close" aria-label="Bezárás">×</button>
    <h2 id="mkx-t">Nyomtatás és export</h2>
    <p>A mise szövege a jelenlegi beállításokkal (formula, állandó részek, rubrikák), oldalszámozva. A beállítások az előnézetben is módosíthatók.</p>
    <div class="mkx-grid">
      <label for="mkx-fs">Betűméret</label><div class="mkx-fs"><input id="mkx-fs" type="range" min="9" max="40" step="0.5" value="${o.fs}"><input id="mkx-fsn" type="number" min="9" max="40" step="0.5" value="${o.fs}"><span>pt</span></div>

      <label for="mkx-m">Margó</label><select id="mkx-m"><option value="narrow" ${o.margin==='narrow'?'selected':''}>keskeny</option><option value="normal" ${o.margin==='normal'?'selected':''}>normál</option><option value="wide" ${o.margin==='wide'?'selected':''}>tágas</option><option value="bind" ${o.margin==='bind'?'selected':''}>kötéshez (kétoldalas)</option></select>
      <label for="mkx-col">Szín</label><select id="mkx-col"><option value="red" ${o.color==='red'?'selected':''}>piros rubrikák</option><option value="bw" ${o.color==='bw'?'selected':''}>fekete-fehér</option></select>
      <label for="mkx-fo">Oldalszám</label><select id="mkx-fo"><option value="center" ${o.folio==='center'?'selected':''}>középen</option><option value="outer" ${o.folio==='outer'?'selected':''}>külső szélen (kétoldalas)</option></select>

      <label class="mkx-chk"><input id="mkx-tp" type="checkbox" ${o.titlePage?'checked':''}> külön címlap</label>
    </div>
    ${d?'':'<p class="mkx-msg">Előbb nyisd meg a misekönyvet, és válts Szöveg nézetre: az export a megjelenített szöveget használja.</p>'}
    <div class="mkx-btns">
      <button class="pri" data-x="print" ${d?'':'disabled'}>Előnézet és nyomtatás<small>PDF: a nyomtatási ablakban válaszd a „Mentés PDF-ként” lehetőséget</small></button>
      <button data-x="word" ${d?'':'disabled'}>Word-dokumentum (.docx)<small>szerkeszthető; oldalszám a láblécben</small></button>
    </div></div>`;
  document.body.appendChild(back);
  const q=id=>back.querySelector('#'+id);
  const fr=q('mkx-fs'),fn=q('mkx-fsn');fr.oninput=()=>{fn.value=fr.value};fn.oninput=()=>{fr.value=fn.value};
  const read=()=>({fs:Math.max(9,Math.min(40,+fn.value||12.5)),size:q('mkx-size').value,lh:q('mkx-lh').value,margin:q('mkx-m').value,color:q('mkx-col').value,folio:q('mkx-fo').value,rh:q('mkx-rh').checked,titlePage:q('mkx-tp').checked});
  const close=()=>back.remove();
